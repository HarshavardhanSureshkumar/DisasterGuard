<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DISASTERGUARD · Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="api.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', sans-serif; transition: background 0.4s ease, color 0.3s ease; }
      
      /* ----- DARK THEME (default) ----- */
      .dark { background: #0b0f14; color: #f0f4f8; }
      .dark .bg-white { background: #0b0f14; }
      .dark .bg-gray-50 { background: #131a20; }
      .dark .bg-gray-100 { background: #1a232b; }
      .dark .text-gray-900 { color: #ffffff; }
      .dark .text-gray-800 { color: #e8edf2; }
      .dark .text-gray-700 { color: #cbd5e1; }
      .dark .text-gray-600 { color: #94a3b8; }
      .dark .text-gray-500 { color: #64748b; }
      .dark .border-gray-200 { border-color: #1e293b; }
      .dark .border-gray-300 { border-color: #1e293b; }
      .dark .bg-white\/70 { background: #0b0f14cc; }
      .dark .bg-white\/90 { background: #0b0f14f2; }
      .dark .bg-white\/50 { background: #0b0f14aa; }
      .dark .hover\:bg-gray-100:hover { background: #1e293b; }
      .dark .glass { background: rgba(0,0,0,0.4); border-color: #1e293b; }
      .dark .focus\:ring-emerald-500:focus { --tw-ring-color: #10b981; }
      .dark .focus\:border-emerald-500:focus { border-color: #10b981; }
      
      /* ----- LIGHT THEME (warm/pleasing) ----- */
      .light { background: #f0f4f8; color: #0f172a; }
      .light .bg-white { background: #ffffff; }
      .light .bg-gray-50 { background: #f8fafc; }
      .light .bg-gray-100 { background: #f1f5f9; }
      .light .text-gray-900 { color: #0f172a; }
      .light .text-gray-800 { color: #0f172a; }
      .light .text-gray-700 { color: #1e293b; }
      .light .text-gray-600 { color: #334155; }
      .light .text-gray-500 { color: #475569; }
      .light .border-gray-200 { border-color: #dce3ed; }
      .light .border-gray-300 { border-color: #cbd5e1; }
      .light .bg-white\/70 { background: #ffffffcc; }
      .light .bg-white\/90 { background: #fffffff2; }
      .light .bg-white\/50 { background: #ffffffaa; }
      .light .hover\:bg-gray-100:hover { background: #e8edf5; }
      .light .glass { background: rgba(255, 255, 255, 0.75); border-color: #d1dce8; backdrop-filter: blur(8px); }
      .light .focus\:ring-emerald-500:focus { --tw-ring-color: #10b981; }
      .light .focus\:border-emerald-500:focus { border-color: #10b981; }
      
      /* Shared styles */
      .glass { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid; transition: background 0.3s, border-color 0.3s; }
      .light .shadow-md { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06); }
      .light .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.07); }
      .light .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.12); }
      .dark .shadow-md { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.4); }
      .dark .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
      .dark .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); }
      
      /* Custom radio card style */
      .role-card { transition: all 0.2s ease; cursor: pointer; }
      .role-card:hover { transform: translateY(-2px); }
      .role-card input:checked + .role-label { border-color: #10b981; background: rgba(16, 185, 129, 0.08); }
      .dark .role-card input:checked + .role-label { border-color: #10b981; background: rgba(16, 185, 129, 0.15); }
      .role-label { border: 2px solid transparent; transition: all 0.2s ease; }

      /* Success message */
      .success-message {
        display: none;
      }
      .success-message.active {
        display: block;
      }
      .form-fields {
        display: block;
      }
      .form-fields.hidden-form {
        display: none;
      }
      
      /* Dynamic label/input switching */
      .signup-field { display: none; }
      .signup-field.active { display: block; }
    </style>
  </head>
  <body>
    <div id="root" class="min-h-screen transition-colors duration-400">
      <!-- ===== HEADER ===== -->
      <header class="fixed top-0 left-0 w-full z-50 backdrop-blur-md border-b transition-colors duration-300 bg-white/70 dark:bg-[#0b0f14]/80 border-gray-200/30 dark:border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex items-center justify-between h-16 md:h-20">
            <!-- Logo -->
            <a href="main-1.html" class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-400 to-cyan-500 flex items-center justify-center shadow-md shadow-emerald-500/20">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3"/></svg>
              </div>
              <span class="font-bold text-xl tracking-tight text-gray-900 dark:text-white">DISASTERGUARD</span>
            </a>

            <!-- Theme toggle -->
            <button id="themeToggle" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-white/10 transition text-xl" aria-label="Toggle theme">
              <span id="themeIcon">🌙</span>
            </button>
          </div>
        </div>
      </header>

      <!-- ===== SIGNUP CARD ===== -->
      <div class="min-h-screen flex items-center justify-center p-4 pt-28 md:pt-36">
        <div class="w-full max-w-md">
          <!-- Back to Home link -->
          <a href="main-1.html" class="inline-flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400 hover:text-emerald-500 dark:hover:text-emerald-400 transition mb-6">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Back to Home
          </a>

          <div class="glass rounded-2xl p-8 shadow-2xl border border-white/10 dark:border-white/5">
            <!-- Logo -->
            <div class="flex items-center justify-center gap-2 mb-6">
              <div class="w-10 h-10 rounded-full bg-gradient-to-br from-emerald-400 to-cyan-500 flex items-center justify-center shadow-md shadow-emerald-500/20">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3"/></svg>
              </div>
              <span class="font-bold text-2xl tracking-tight text-gray-900 dark:text-white">DISASTERGUARD</span>
            </div>

            <h2 class="text-2xl font-bold text-center text-gray-800 dark:text-white mb-2">Create Account</h2>
            <p class="text-sm text-center text-gray-600 dark:text-gray-400 mb-8">Sign up to get started</p>

            <!-- Success Message -->
            <div id="successMessage" class="success-message text-center py-8">
              <div class="w-16 h-16 mx-auto rounded-full bg-emerald-500/20 flex items-center justify-center mb-4">
                <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
              </div>
              <h3 class="text-2xl font-bold text-emerald-500 mb-2">Account Created!</h3>
              <p class="text-gray-600 dark:text-gray-400 mb-4">Your account has been successfully registered.</p>
              <a href="login.html" class="inline-block mt-2 px-8 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold shadow-lg shadow-emerald-500/25 transition transform hover:scale-[1.02] active:scale-[0.98]">
                Sign In →
              </a>
            </div>

            <!-- Form -->
            <form id="signupForm" class="form-fields space-y-6">
              <!-- Role Selection -->
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">Select Your Role</label>
                <div class="grid grid-cols-3 gap-3">
                  <label class="role-card">
                    <input type="radio" name="role" value="citizen" checked class="hidden" />
                    <div class="role-label rounded-xl p-3 text-center hover:bg-gray-50 dark:hover:bg-white/5">
                      <div class="text-xs font-semibold text-gray-700 dark:text-gray-300">Citizen</div>
                    </div>
                  </label>
                  <label class="role-card">
                    <input type="radio" name="role" value="rescue" class="hidden" />
                    <div class="role-label rounded-xl p-3 text-center hover:bg-gray-50 dark:hover:bg-white/5">
                      <div class="text-xs font-semibold text-gray-700 dark:text-gray-300">Rescue Team</div>
                    </div>
                  </label>
                  <label class="role-card">
                    <input type="radio" name="role" value="admin" class="hidden" />
                    <div class="role-label rounded-xl p-3 text-center hover:bg-gray-50 dark:hover:bg-white/5">
                      <div class="text-xs font-semibold text-gray-700 dark:text-gray-300">Control Center</div>
                    </div>
                  </label>
                </div>
              </div>

              <!-- Citizen Field - Full Name & Email -->
              <div id="citizenField" class="signup-field active">
                <div class="space-y-4">
                  <div>
                    <label for="citizenName" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Full Name</label>
                    <input type="text" id="citizenName" class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white/50 dark:bg-black/20 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" placeholder="John Doe" />
                  </div>
                  <div>
                    <label for="citizenEmail" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email Address</label>
                    <input type="email" id="citizenEmail" class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white/50 dark:bg-black/20 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" placeholder="you@example.com" />
                  </div>
                </div>
              </div>

              <!-- Rescue Team Field - Rescue Team ID, Department & Name -->
              <div id="rescueField" class="signup-field">
                <div class="space-y-4">
                  <div>
                    <label for="rescueName" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Team Name</label>
                    <input type="text" id="rescueName" class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white/50 dark:bg-black/20 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" placeholder="Flood Response Team" />
                  </div>
                  <div>
                    <label for="rescueId" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Rescue Team ID</label>
                    <input type="text" id="rescueId" class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white/50 dark:bg-black/20 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" placeholder="RT-2026-XXXX" />
                  </div>
                  <div>
                    <label for="rescueDepartment" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Department</label>
                    <select id="rescueDepartment" class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white/50 dark:bg-black/20 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
                      <option value="Flood Response">Flood Response</option>
                      <option value="Rescue Unit">Rescue Unit</option>
                      <option value="Medical Support">Medical Support</option>
                      <option value="Reserve Response">Reserve Response</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- Control Center Field - Control Center ID & Name -->
              <div id="adminField" class="signup-field">
                <div class="space-y-4">
                  <div>
                    <label for="adminName" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Center Name</label>
                    <input type="text" id="adminName" class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white/50 dark:bg-black/20 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" placeholder="Control Center 1" />
                  </div>
                  <div>
                    <label for="adminId" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Control Center ID</label>
                    <input type="text" id="adminId" class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white/50 dark:bg-black/20 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" placeholder="CC-2026-XXXX" />
                  </div>
                </div>
              </div>

              <!-- Password -->
              <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white/50 dark:bg-black/20 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" placeholder="••••••••" />
              </div>

              <!-- Confirm Password -->
              <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" required class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white/50 dark:bg-black/20 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" placeholder="••••••••" />
              </div>

              <!-- Submit -->
              <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold shadow-lg shadow-emerald-500/25 transition transform hover:scale-[1.02] active:scale-[0.98]">
                Create Account →
              </button>
            </form>

            <!-- Sign In Link -->
            <div class="mt-6 text-center">
              <p class="text-sm text-gray-600 dark:text-gray-400">
                Already have an account? 
                <a href="login.html" class="text-emerald-600 dark:text-emerald-400 font-semibold hover:underline transition">Sign In</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function() {
        // ===== THEME TOGGLE =====
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        function setTheme(theme) {
          if (theme === 'dark') {
            html.classList.remove('light');
            html.classList.add('dark');
            themeIcon.textContent = '☀️';
            localStorage.setItem('dg-theme', 'dark');
          } else {
            html.classList.remove('dark');
            html.classList.add('light');
            themeIcon.textContent = '🌙';
            localStorage.setItem('dg-theme', 'light');
          }
        }

        const stored = localStorage.getItem('dg-theme');
        if (stored === 'light') setTheme('light');
        else setTheme('dark');

        themeToggle.addEventListener('click', function(e) {
          e.stopPropagation();
          const isDark = html.classList.contains('dark');
          setTheme(isDark ? 'light' : 'dark');
        });

        // ===== ROLE CARD SELECTION =====
        const roleRadios = document.querySelectorAll('input[name="role"]');
        const citizenField = document.getElementById('citizenField');
        const rescueField = document.getElementById('rescueField');
        const adminField = document.getElementById('adminField');

        function updateFields(role) {
          citizenField.classList.remove('active');
          rescueField.classList.remove('active');
          adminField.classList.remove('active');

          if (role === 'citizen') citizenField.classList.add('active');
          else if (role === 'rescue') rescueField.classList.add('active');
          else if (role === 'admin') adminField.classList.add('active');
        }

        document.querySelectorAll('.role-card').forEach(card => {
          const radio = card.querySelector('input[type="radio"]');
          const label = card.querySelector('.role-label');
          
          card.addEventListener('click', function() {
            radio.checked = true;
            document.querySelectorAll('.role-label').forEach(l => {
              l.style.borderColor = 'transparent';
              l.style.background = 'transparent';
            });
            label.style.borderColor = '#10b981';
            if (html.classList.contains('dark')) {
              label.style.background = 'rgba(16, 185, 129, 0.15)';
            } else {
              label.style.background = 'rgba(16, 185, 129, 0.08)';
            }
            updateFields(radio.value);
            // Reset form visibility
            document.getElementById('signupForm').classList.remove('hidden-form');
            document.getElementById('successMessage').classList.remove('active');
          });
        });

        // Check initial state
        const checked = document.querySelector('input[name="role"]:checked');
        if (checked) {
          const label = checked.closest('.role-card').querySelector('.role-label');
          label.style.borderColor = '#10b981';
          if (html.classList.contains('dark')) {
            label.style.background = 'rgba(16, 185, 129, 0.15)';
          } else {
            label.style.background = 'rgba(16, 185, 129, 0.08)';
          }
          updateFields(checked.value);
        }

        // ===== SIGNUP FORM =====
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const rawRole = document.querySelector('input[name="role"]:checked').value;
          const backendRole = rawRole === 'admin' ? 'command' : rawRole;
          const password = document.getElementById('password').value.trim();
          const confirmPassword = document.getElementById('confirmPassword').value.trim();

          // Check password match
          if (password !== confirmPassword) {
            alert('Passwords do not match!');
            return;
          }

          if (password.length < 6) {
            alert('Password must be at least 6 characters long.');
            return;
          }

          let identifier = '';
          let name = '';
          let department = null;

          if (rawRole === 'citizen') {
            identifier = document.getElementById('citizenEmail').value.trim();
            name = document.getElementById('citizenName').value.trim();
            if (!identifier || !name) {
              alert('Please enter your full name and email address.');
              return;
            }
          } else if (rawRole === 'rescue') {
            identifier = document.getElementById('rescueId').value.trim();
            name = document.getElementById('rescueName').value.trim();
            department = document.getElementById('rescueDepartment').value;
            if (!identifier || !name) {
              alert('Please enter your Rescue Team ID and team name.');
              return;
            }
            if (!identifier.match(/^RT-\d{4}-\d{4}$/)) {
              alert('Rescue Team ID must follow format: RT-2026-XXXX (e.g., RT-2026-0005)');
              return;
            }
          } else if (rawRole === 'admin') {
            identifier = document.getElementById('adminId').value.trim();
            name = document.getElementById('adminName').value.trim();
            department = 'Command Staff';
            if (!identifier || !name) {
              alert('Please enter your Control Center ID and name.');
              return;
            }
            if (!identifier.match(/^CC-\d{4}-\d{4}$/)) {
              alert('Control Center ID must follow format: CC-2026-XXXX (e.g., CC-2026-0003)');
              return;
            }
          }

          const submitBtn = document.querySelector('#signupForm button[type="submit"]');
          try {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';

            const data = await window.DisasterGuard.post('/api/auth/register', {
              role: backendRole,
              identifier,
              password,
              name,
              department
            });

            // Set session token
            window.DisasterGuard.setAuth(data.token, data.user);

            // Show success message
            document.getElementById('signupForm').classList.add('hidden-form');
            document.getElementById('successMessage').classList.add('active');

            const signInBtn = document.querySelector('#successMessage a');
            signInBtn.href = data.dashboardUrl || 'login.html';
          } catch (err) {
            alert(err.message || 'Failed to create account. Please try again.');
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account →';
          }
        });
      })();
    </script>
  </body>
</html>
